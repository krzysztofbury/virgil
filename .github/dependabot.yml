version: 2
updates:
  # Python dependencies are intentionally not listed. The fixed `exclude-newer`
  # quarantine cutoff in pyproject.toml rejects any version published after it,
  # so pinned-version bumps cannot lock. They are updated by moving the cutoff
  # at release time; Dependabot alerts still report advisories for uv.lock.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Warsaw
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Warsaw
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      docker:
        patterns: ["*"]
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Warsaw
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      docker-compose:
        patterns: ["*"]
