name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: '0.13.5'
  PYTHON_VERSION: '3.14.9'
  LITELLM_LOCAL_MODEL_COST_MAP: 'true'

jobs:
  verify:
    name: ci
    if: github.ref_type != 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install "$PYTHON_VERSION"
      - run: uv sync --locked --extra dev --python "$PYTHON_VERSION"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Repository hooks
        env:
          SKIP: no-commit-to-branch
        run: uv run --locked --extra dev pre-commit run --all-files
      # No --with-deps: the runner image already carries Chrome's libraries,
      # and apt against the Ubuntu mirror was the step that stalled CI.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - name: Browser for the smoke test
        timeout-minutes: 3
        run: uv run --locked --extra dev playwright install chromium
      - name: Tests
        env:
          # tests/test_browser_smoke.py fails instead of skipping without a browser.
          VIRGIL_REQUIRE_BROWSER: '1'
        # A test stuck past faulthandler_timeout dumps every thread's stack.
        run: uv run --locked --extra dev pytest -q
      - name: Locked MCP stdio
        run: |
          uv lock --check --script mcp_server/virgil_mcp.py
          uv run --locked --extra dev python scripts/check_mcp.py
      - name: Audit locked dependencies
        # Ignored until litellm allows filelock 4 (#154). Each is local: Windows
        # only, or it needs a second local user, and the container has one.
        # GHSA-fq56-3cx3-fjxp needs neither: a reused inode can admit two
        # SoftFileLock holders. Virgil's code takes no such lock; huggingface_hub
        # may, for its own download cache, so a clash is limited to that cache.
        env:
          IGNORED: >-
            --ignore-vuln GHSA-567q-5qvw-pf92
            --ignore-vuln GHSA-6627-m3xw-93mp
            --ignore-vuln GHSA-69hj-f68j-2879
            --ignore-vuln GHSA-8mx5-7m5m-r77g
            --ignore-vuln GHSA-9c4x-gm8v-wgc4
            --ignore-vuln GHSA-9j6q-wvj5-jgjg
            --ignore-vuln GHSA-9vhv-jxww-xfm5
            --ignore-vuln GHSA-cwqr-hh33-gh44
            --ignore-vuln GHSA-fq56-3cx3-fjxp
            --ignore-vuln GHSA-j8f7-rjxc-mr56
            --ignore-vuln GHSA-m462-7rxw-wvpg
            --ignore-vuln GHSA-rfpc-qcw5-3pc4
            --ignore-vuln GHSA-v4x8-3wr5-3wq8
        run: |
          uv export --locked --extra dev --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/requirements.txt"
          # shellcheck disable=SC2086
          uv run --locked --extra dev pip-audit --strict --disable-pip --require-hashes $IGNORED -r "$RUNNER_TEMP/requirements.txt"
          uv export --locked --script mcp_server/virgil_mcp.py --format requirements-txt --output-file "$RUNNER_TEMP/mcp-requirements.txt"
          uv run --locked --extra dev pip-audit --strict --disable-pip --require-hashes -r "$RUNNER_TEMP/mcp-requirements.txt"

  image:
    needs: verify
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the candidate once
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: virgil-candidate:${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the production image
        run: python3 scripts/check_image.py "virgil-candidate:$GITHUB_SHA"
      - name: Login to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the verified image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
        run: |
          for tag in "sha-$GITHUB_SHA" "sha-${GITHUB_SHA::7}" latest; do
            docker tag "virgil-candidate:$GITHUB_SHA" "$IMAGE_REPOSITORY:$tag"
            docker push "$IMAGE_REPOSITORY:$tag"
          done

  version:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release version and ancestry
        run: |
          python3 scripts/check_release.py "$GITHUB_REF_NAME"
          git merge-base --is-ancestor HEAD origin/main
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Alias the already verified main image
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
        run: |
          # Missing SHA images fail closed. Tags never build or update latest.
          revision=$(git rev-parse HEAD)
          docker buildx imagetools create --prefer-index=false \
            --tag "$IMAGE_REPOSITORY:${GITHUB_REF_NAME#v}" \
            "$IMAGE_REPOSITORY:sha-$revision"
