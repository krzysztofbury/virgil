name: CI

# PRs and feature branches only — pushes to main run the full test gate inside
# the Release workflow (release.yml) before the image is built and pushed.
on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      # tests/test_training_page.py shells out to `node` for a handful of
      # tests that execute the real, extracted Alpine picker JS (not a
      # hand-copied re-implementation of it) — those tests skip gracefully
      # if `node` is absent, but a skip must never be the ONLY thing standing
      # between a regression and a merged PR. Pin Node explicitly rather than
      # relying on whatever ubuntu-latest happens to preinstall.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Ruff lint
        run: uv run ruff check app/ scripts/ tests/

      - name: Ruff format check
        run: uv run ruff format --check app/ scripts/ tests/

      - name: Bandit security scan
        run: uv run bandit -c pyproject.toml -r app/

      - name: Tests
        run: uv run pytest -q
