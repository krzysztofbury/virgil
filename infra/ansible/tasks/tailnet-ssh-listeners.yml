---
- name: Read the SSH listeners
  ansible.builtin.command:
    argv: ["ss", "-H", "-l", "-n", "-t", "sport = :22"]
  register: ssh_listeners
  changed_when: false
  check_mode: false

- name: Require SSH to listen on loopback only
  vars:
    locals: "{{ ssh_listeners.stdout_lines | map('split') | map(attribute=3) | list }}"
  ansible.builtin.assert:
    that:
      - locals | length > 0
      - locals | difference(['127.0.0.1:22', '[::1]:22']) | length == 0
    fail_msg: sshd listens beyond loopback; public SSH is not closed (#174).
