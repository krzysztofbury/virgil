[defaults]
inventory = inventory/production.yml
host_key_checking = True
interpreter_python = auto_silent
private_key_file = ~/.ssh/virgil_mikrus_ed25519
retry_files_enabled = False
timeout = 20

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ControlPath=~/.ssh/virgil-ansible-%C -o StrictHostKeyChecking=yes -o UserKnownHostsFile=infra/ansible/known_hosts -o GlobalKnownHostsFile=/dev/null -o KnownHostsCommand=none -o VerifyHostKeyDNS=no -o UpdateHostKeys=no -o CheckHostIP=no -o HostKeyAlgorithms=ssh-ed25519 -o IdentitiesOnly=yes -o PreferredAuthentications=publickey -o HostbasedAuthentication=no -o KbdInteractiveAuthentication=no -o PasswordAuthentication=no
pipelining = True
